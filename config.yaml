# All tunables live here. Nothing load-bearing should be hardcoded in pumpbot/.

wallet:
  # Preflight refuses to start outside this range.
  # Floor = position + ata_rent + 4x priority-fee ceiling (a round trip + a retry + the close).
  min_balance_sol: 0.0080
  max_balance_sol: 0.05

trading:
  position_sol: 0.001
  max_concurrent_positions: 1
  # v2 tier-2 filters, governance limits, notifications, PumpSwap/Jupiter exit routing,
  # and credit-meter degradation tiers unlock once the wallet is funded above this.
  v2_features_unlock_balance_sol: 0.1
  # Buffer against curve-state drift between sizing a trade and it landing (even the
  # ~0.1s gap from a `confirmed`-commitment simulateTransaction can see a competing
  # buy land first). Buy's max_sol_cost is padded up by this fraction; sell's
  # min_sol_output is padded down by it. Zero buffer was tripping pump.fun's own
  # slippage-protection error (Custom 6000/6002) on live buy simulations -- see
  # README.md.
  slippage_tolerance_fraction: 0.05
  # Sizing-discipline guard, checked at startup against the ledger's real
  # closed-trade count (MILESTONE-3-HANDOFF.md Section 5.6). Warns loudly
  # (CRITICAL) rather than refusing to start -- it's the operator's money
  # and their call, not a config file's to gatekeep.
  baseline_position_sol: 0.001
  min_closed_trades_before_sizeup: 30

fees:
  # (base fee + priority fee) / position_sol threshold. Fractional ceiling.
  # Deliberately excludes ATA rent -- rent is paid in the buy leg and
  # recovered in the ATA-close leg (float, not a cost); counting it here
  # would reject nearly every trade at a small position size while looking
  # like a working filter. See main.py's fee gate / estimate_entry_fee_lamports.
  max_fee_fraction: 0.25
  # Absolute ceiling in SOL, independent of the fraction above — at this wallet size a
  # percentage alone permits fees that are large relative to the whole wallet.
  # Also excludes ATA rent, same reasoning as max_fee_fraction above.
  max_fee_absolute_sol: 0.0015
  # Enforced maximum for priority_fee_sol below -- config load fails if
  # priority_fee_sol exceeds this. Currently unreachable since
  # priority_fee_sol is 0.0, but it's the real ceiling once that changes.
  priority_fee_ceiling_sol: 0.0008
  # Reserved per open position so a pending ATA close is never left unpayable.
  close_fee_reserve_sol: 0.0003
  # Explicit compute-unit limit for every transaction (buy, sell, ATA
  # close) -- free, and tighter scheduling than the default
  # 200,000-CU-per-instruction assumption. Pump.fun's buy/sell instructions
  # are simple account writes; 40,000 CU is generous headroom measured
  # against similar Anchor program calls, not a hard on-chain requirement.
  compute_unit_limit: 40000
  # The priority fee actually paid, in SOL, per transaction. 0.0 is
  # DELIBERATE -- this project has explicitly dropped the latency race
  # (see the PRD's Out of Scope section), so paying for faster inclusion
  # buys nothing strategically yet. Raising this is a measured experiment
  # for later (compare EntryFilled latency and the skip/failure funnel at
  # 0 vs a nonzero fee), not a default to bump casually.
  priority_fee_sol: 0.0

exits:
  # Deferred: whether 1.5x/2.5x/-35% are the right SHAPE is an open question
  # (see .claude/plans/DEFERRED-exit-threshold-retune.md) but n=1 real closed
  # trades means retuning now would be fitting noise, not data. Unchanged by
  # Milestone 4 -- note Task 1 changed what these numbers MEASURE (realizable
  # proceeds, not spot), which makes them effectively slightly tighter on the
  # upside and slightly looser on the downside than before.
  take_profit_1_multiple: 1.5
  take_profit_1_fraction: 0.5
  take_profit_2_multiple: 2.5
  stop_loss_fraction: -0.35
  timeout_seconds: 300
  # Behavior-aware exits (MILESTONE-4-HANDOFF.md). Both peer-proven, both
  # default on, both individually switchable.
  trailing_enabled: true
  # A trailing stop live from entry is just a tighter stop-loss and fires on
  # ordinary entry noise -- it only arms once realizable proceeds reach this
  # multiple of cost basis. Deliberately below take_profit_1_multiple (1.5)
  # so a run that stalls just short of the first rung is still protected.
  trailing_arm_multiple: 1.3
  # Once armed, fires when realizable proceeds fall back this fraction of the
  # gain from the peak multiple -- i.e. give back a quarter of peak value
  # before bailing. Wide enough not to fire on the normal volatility of a
  # minutes-old token.
  trailing_drawdown_fraction: 0.25
  # Highest-priority exit in the ladder: the creator moving tokens is
  # information about why the price is about to move, and unlike a price
  # threshold, it doesn't recover. See main.py's monitor loop for the
  # baseline/decrease detection and its unknown-is-never-a-sell-signal rule.
  creator_sell_enabled: true

filters:
  tier1:
    max_creator_supply_fraction: 0.10
    max_mints_per_second: 5
    curve_completion_guard_fraction: 0.80
  tier2:
    enabled: true
    mode: enforce
    # min_socials: 1 matches the strongest-evidence cut in the source research
    # (Telegram present vs absent, 8.94x graduation-rate difference). 3
    # corresponds to the 17.4x figure but rejects far more flow -- revisit
    # with local ledger data once Milestone 2 lands.
    min_socials: 1
    fetch_timeout_seconds: 0.8
    fail_closed: false
    cache_max_entries: 1000
  creator_blocklist_path: data/creator_blocklist.json
  name_symbol_blocklist_path: data/name_blocklist.txt

rpc:
  # Total node capacity is 12 req/s. 4 of that is reserved below for
  # pool="shadow" (shadow.py) in a disjoint token bucket, specifically so a
  # burst of shadow polls can never queue ahead of a live trading call --
  # a shared limiter was measured to let exactly that happen (see
  # shadow.py's module docstring). 8 req/s is far above real trading
  # demand at max_concurrent_positions=1.
  rps_limit: 8
  shadow_rps_limit: 4
  # Rough per-method credit costs; correct against the real QuickNode dashboard after
  # the first live hour (see README).
  credit_costs:
    getAccountInfo: 1
    getMultipleAccounts: 1
    getSignatureStatuses: 1
    getLatestBlockhash: 1
    sendTransaction: 1
    simulateTransaction: 1
    getBalance: 1
    getTokenAccountBalance: 1
  daily_credit_halt: 9000000
  max_retries: 5
  backoff_base_seconds: 0.5

reconciliation:
  interval_seconds: 60

heartbeat:
  interval_seconds: 300
  # Zero executed trades across this many consecutive heartbeats while candidates
  # were arriving is an idle alarm, not a quiet period.
  idle_alarm_heartbeats: 6

execution:
  skip_preflight: true
  confirm_poll_interval_seconds: 1.0
  confirm_timeout_seconds: 45
  # A blockhash is valid for ~150 blocks (~60-90s) -- confirm_timeout_seconds
  # above is comfortably inside that, so this should rarely trigger. When it
  # does, resubmission is safe: an expired blockhash provably can never land,
  # so there's no double-send risk (see submit.py's BlockhashExpiredError).
  max_resubmit_attempts: 2
  ata_close_max_retries: 10
  jito_bundle_enabled: false

failsafe:
  # Consecutive execution failures before dropping to exit-only mode (new entries
  # halted, exits and reconciliation stay funded).
  consecutive_failure_limit: 3

probe:
  default_hours: 1

ledger:
  # Rotated daily to <stem>-YYYY-MM-DD<suffix> beside this path (see
  # ledger.py) -- an unbounded single file would make the startup orphan
  # scan (find_orphans) grow without limit.
  path: data/ledger.jsonl
  enabled: true

shadow:
  # Off by default: polling costs real RPC budget even at a low
  # sample_fraction, and it's meant to be switched on deliberately after
  # observing credit burn under normal trading, not silently by default.
  enabled: false
  # Ignored for the "bought" arm, which is always sampled at 1.0 -- it's
  # small (bounded by trade count) and sampling it would destroy the
  # adverse-selection comparison it exists to enable. Applies to
  # "rejected" and "skipped" only.
  sample_fraction: 0.10
  poll_interval_seconds: 15
  # Matches exits.timeout_seconds deliberately, so the shadow horizon and
  # the bot's own maximum hold are directly comparable.
  horizon_seconds: 300
  max_tracked: 50
